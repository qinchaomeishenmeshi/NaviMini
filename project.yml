name: NaviMini
options:
  bundleIdPrefix: com.navimini
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    PRODUCT_NAME: NaviMini
    SWIFT_VERSION: "5.0"

targets:
  NaviMini:
    type: application
    platform: iOS
    sources:
      - path: NaviMini
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
  NaviMiniTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NaviMiniTests
    dependencies:
      - target: NaviMini
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: NaviMiniTests
